name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build static site artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/assets
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://www.simplemaplab.com/maps/blank/india.svg" \
            -o _site/assets/india-outline.svg
          test -s _site/assets/india-outline.svg
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
